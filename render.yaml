services:
  - type: web
    name: pre-fatura-storage
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: pre-fatura-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8787
      - key: PRE_FATURA_DATA_DIR
        value: /var/data
