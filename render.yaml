services:
  - type: web
    name: pre-fatura-storage
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: pre-fatura-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        value: /var/data/app.db
      - key: FRONTEND_URL
        value: https://ofmrmatte.github.io
