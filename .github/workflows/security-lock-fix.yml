name: security-lock-fix

on:
  push:
    branches: [security/full-hardening]

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/full-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable production resolutions
        run: npm audit fix --package-lock-only --omit=dev
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh vulnerable dependency resolutions"
          git push origin HEAD:security/full-hardening
