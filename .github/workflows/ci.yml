name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening-final-source-fix:
    name: Hardening Final Source Fix
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/hardening-before-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Fix nullable audit entity id
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/api/desvios-pnr/validate/route.ts')
          text = path.read_text(encoding='utf-8')
          old = '      entityId: persistence.fileId,'
          new = '      entityId: persistence.fileId || undefined,'
          if old not in text:
              raise SystemExit('Expected audit entityId line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Inspect dead-code heuristic
        shell: bash
        run: |
          npm run audit:dead-code
          latest=$(ls -1t scripts/logs/dead-code-*.json | head -1)
          echo "Dead-code report: $latest"
          cat "$latest"

      - name: Commit typing fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/desvios-pnr/validate/route.ts
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "narrow pnr audit entity id"
          git push origin "HEAD:${{ github.head_ref }}"

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Rule tests
        run: npm run test:rules

      - name: Metadata check
        run: npm run check:metadata

      - name: Script syntax check
        run: npm run check:scripts

      - name: Text encoding check
        run: npm run check:encoding

      - name: Validate public CI environment
        run: npm run check:ci-env

      - name: Build
        run: npm run build

      - name: Offline CI audits
        run: npm run audit:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e:smoke

  authenticated-e2e:
    name: Authenticated E2E
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require authenticated E2E credentials
        shell: bash
        run: |
          missing=0
          for name in E2E_USER_EMAIL E2E_USER_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. Authenticated E2E cannot be reported as passing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated browser checks
        run: npm run test:e2e -- tests/e2e/authenticated.spec.ts

  database-audit:
    name: Database Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require database audit connection
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not configured. Database Audit cannot be reported as passing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL read-only audits
        run: npm run audit:db
