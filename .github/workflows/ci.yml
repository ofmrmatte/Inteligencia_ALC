name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (legacy debt is advisory)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build Inteligência and PNR connector
        run: npm run build

      - name: Build Atendimento
        run: npm run build:atendimento

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Static performance audit
        run: npm run audit:perf
