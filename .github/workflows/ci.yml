name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening-source-refresh:
    name: Hardening Source Refresh
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/hardening-before-ui'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply transactional import route patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_persist(path, replacement):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r"async function persistImport\(\{.*?\n\}\n\nexport async function POST",
                  replacement + "\n\nexport async function POST",
                  text,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"Expected one persistImport block in {path}, found {count}")
              file.write_text(updated, encoding="utf-8")

          gestao = r'''async function persistImport({
            file,
            buffer,
            records,
            stats,
            period,
            userId,
            userEmail,
          }: {
            file: File;
            buffer: ArrayBuffer;
            records: ParsedRecord[];
            stats: SheetValidation[];
            period: ReturnType<typeof detectPeriod>;
            userId: string;
            userEmail: string | null;
          }) {
            const supabase = await createServerSupabaseClient();
            const fileHash = createHash("sha256").update(Buffer.from(buffer)).digest("hex");
            const storagePath = `next/gestao-pacotes/${fileHash.slice(0, 16)}-${file.name.replace(/[^\\w.\\-]+/g, "_")}`;
            const metadata = {
              source: "next_app_router",
              file_hash: fileHash,
              module_key: "gestao_pacotes",
              competencia: period.competencia,
              quinzena: period.quinzena,
              sheets: stats,
              raw_storage_persisted: false,
            };

            const { data, error } = await supabase.rpc("commit_gestao_pacotes_import", {
              p_file: {
                file_name: file.name,
                storage_path: storagePath,
                file_type: "GESTAO_PACOTES",
                file_size: file.size,
                uploaded_by: userId,
                uploaded_by_email: userEmail,
                reference_month: period.reference_month || null,
                reference_year: period.reference_year || null,
                is_active: true,
                period_label: period.quinzena || null,
                period_type: period.period_type || null,
                metadata,
              },
              p_rows: records,
              p_processed: {
                module_key: "gestao_pacotes",
                file_name: file.name,
                file_hash: fileHash,
                file_size: file.size,
                last_modified: String(file.lastModified || ""),
                competencia: period.competencia || null,
                storage_path: storagePath,
                raw_file_deleted: true,
                file_role: "quinzena",
              },
            });
            if (error) throw error;
            return data as { fileId: string | null; fileHash: string; duplicateFile: boolean; persistedRows: number };
          }'''

          pnr = r'''async function persistImport({
            file,
            buffer,
            records,
            stats,
            period,
            userId,
            userEmail,
          }: {
            file: File;
            buffer: ArrayBuffer;
            records: ParsedPnrRecord[];
            stats: Array<{ name: string; acceptedRows: number; ignoredRows: number; reason?: string }>;
            period: ReturnType<typeof detectPeriod>;
            userId: string;
            userEmail: string | null;
          }) {
            const supabase = await createServerSupabaseClient();
            const fileHash = createHash("sha256").update(Buffer.from(buffer)).digest("hex");
            const storagePath = `next/desvios-pnr/${fileHash.slice(0, 16)}-${file.name.replace(/[^\\w.\\-]+/g, "_")}`;
            const metadata = {
              source: "next_app_router",
              file_hash: fileHash,
              module_key: "desvios_pnr",
              competencia: period.competencia,
              quinzena: period.quinzena,
              sheets: stats,
              raw_storage_persisted: false,
            };

            const { data, error } = await supabase.rpc("commit_desvios_pnr_import", {
              p_file: {
                file_name: file.name,
                storage_path: storagePath,
                file_type: "DESVIOS_PNR",
                file_size: file.size,
                uploaded_by: userId,
                uploaded_by_email: userEmail,
                reference_month: period.mes || null,
                reference_year: period.ano || null,
                is_active: true,
                period_label: period.quinzena || null,
                period_type: period.quinzenaKey || null,
                metadata,
              },
              p_rows: records,
              p_processed: {
                module_key: "desvios_pnr",
                file_name: file.name,
                file_hash: fileHash,
                file_size: file.size,
                last_modified: String(file.lastModified || ""),
                competencia: period.competencia || null,
                storage_path: storagePath,
                raw_file_deleted: true,
                file_role: "pnr",
              },
            });
            if (error) throw error;
            return data as { fileId: string | null; fileHash: string; duplicateFile: boolean; persistedRows: number };
          }'''

          replace_persist("app/api/gestao-pacotes/validate/route.ts", gestao)
          replace_persist("app/api/desvios-pnr/validate/route.ts", pnr)

          gestao_path = Path("app/api/gestao-pacotes/validate/route.ts")
          text = gestao_path.read_text(encoding="utf-8")
          text = text.replace("    persisted: Boolean(persistence),", "    persisted: Boolean(persistence && !persistence.duplicateFile),")
          text = text.replace(
              '''    message: acceptedRows\n      ? persistence\n        ? "Planilha importada com identidade de pacote e exclusão de totais."\n        : "Planilha validada com identidade de pacote e exclusão de totais."\n      : "Planilha lida, mas nenhum evento válido foi encontrado.",''',
              '''    message: acceptedRows\n      ? persistence?.duplicateFile\n        ? "Este arquivo já havia sido processado. Nenhum registro foi duplicado."\n        : persistence\n          ? "Planilha importada com identidade de pacote e exclusão de totais."\n          : "Planilha validada com identidade de pacote e exclusão de totais."\n      : "Planilha lida, mas nenhum evento válido foi encontrado.",'''
          )
          gestao_path.write_text(text, encoding="utf-8")

          pnr_path = Path("app/api/desvios-pnr/validate/route.ts")
          text = pnr_path.read_text(encoding="utf-8")
          text = text.replace("  if (persistence) {", "  if (persistence && !persistence.duplicateFile) {")
          text = text.replace("    persisted: Boolean(persistence),", "    persisted: Boolean(persistence && !persistence.duplicateFile),")
          text = text.replace(
              '    message: persistence ? "PNR importado e métricas atualizadas." : "PNR validado sem persistência.",',
              '    message: persistence?.duplicateFile ? "Este PNR já havia sido processado. Nenhum registro foi duplicado." : persistence ? "PNR importado e métricas atualizadas." : "PNR validado sem persistência.",'
          )
          pnr_path.write_text(text, encoding="utf-8")

          note = Path("docs/HARDENING_PR_NOTE.md")
          if note.exists():
              note.unlink()
          PY

      - name: Commit source hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "use atomic commits for remaining imports"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Remove temporary branches
        shell: bash
        continue-on-error: true
        run: |
          git push origin --delete agent/hardening-before-ui-shadow agent/hardening-pr-snapshot agent/hardening-final-snapshot || true

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Rule tests
        run: npm run test:rules

      - name: Metadata check
        run: npm run check:metadata

      - name: Script syntax check
        run: npm run check:scripts

      - name: Text encoding check
        run: npm run check:encoding

      - name: Validate public CI environment
        run: npm run check:ci-env

      - name: Build
        run: npm run build

      - name: Offline CI audits
        run: npm run audit:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e:smoke

  authenticated-e2e:
    name: Authenticated E2E
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require authenticated E2E credentials
        shell: bash
        run: |
          missing=0
          for name in E2E_USER_EMAIL E2E_USER_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. Authenticated E2E cannot be reported as passing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated browser checks
        run: npm run test:e2e -- tests/e2e/authenticated.spec.ts

  database-audit:
    name: Database Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Require database audit connection
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not configured. Database Audit cannot be reported as passing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL read-only audits
        run: npm run audit:db
