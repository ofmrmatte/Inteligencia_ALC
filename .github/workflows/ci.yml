name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alc_atendimento_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATENDIMENTO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alc_atendimento_test
      ATENDIMENTO_TEST_CORE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alc_core_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (legacy debt is advisory)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Isolated Core test database
        run: docker exec ${{ job.services.postgres.id }} psql -U postgres -c 'CREATE DATABASE alc_core_test'

      - name: Tests
        run: npm test

      - name: Build Inteligência and PNR connector
        run: npm run build

      - name: Build Atendimento
        run: npm run build:atendimento

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Static performance audit
        run: npm run audit:perf
